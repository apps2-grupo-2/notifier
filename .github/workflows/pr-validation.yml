name: PR Validation

on:
  pull_request:
    branches:
      - test
      - production
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    env:
      # APP
      PORT: ${{ secrets.PORT }}

      # DATABASE
      DB_ENABLED: ${{ secrets.DB_ENABLED }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_CONNECTION_LIMIT: ${{ secrets.DB_CONNECTION_LIMIT }}
      DB_QUEUE_LIMIT: ${{ secrets.DB_QUEUE_LIMIT }}
      DB_WAIT_FOR_CONNECTIONS: ${{ secrets.DB_WAIT_FOR_CONNECTIONS }}

      # PAGINATION
      PAGINATION_DEFAULT_PAGE_SIZE: ${{ secrets.PAGINATION_DEFAULT_PAGE_SIZE }}

      # MODULES
      APPOINTMENTS_ENABLED: ${{ secrets.APPOINTMENTS_ENABLED }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-node-22-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-22-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
